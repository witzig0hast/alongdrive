services:
  deaddesert:
    build: .
    image: dead-desert:latest
    container_name: dead-desert
    restart: unless-stopped
    ports:
      - "8080:8080"          # Host-Port:Container-Port (Container-Port muss zu PORT passen!)
    volumes:
      - deaddesert-data:/data  # Accounts, Sessions, Bestenliste
    environment:
      PORT: "8080"
      MAX_PLAYERS: "8"
      # Öffentliche Adresse (für SSO-Redirect und Secure-Cookies hinter Reverse-Proxy), z. B. https://spiel.example.de
      PUBLIC_URL: ""
      # --- Optional: SSO per OpenID Connect (Authentik, Keycloak, Authelia, Google ...)
      # Redirect-URI im Provider eintragen: <PUBLIC_URL>/auth/oidc/callback
      OIDC_ISSUER: ""        # z. B. https://auth.example.de/application/o/dead-desert/
      OIDC_CLIENT_ID: ""
      OIDC_CLIENT_SECRET: ""
      OIDC_NAME: "Authentik"  # Beschriftung des SSO-Buttons
      # AUTH_DISABLED: "1"   # NUR für lokale Tests: schaltet die Anmeldung ab!

volumes:
  deaddesert-data:
